name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: drf-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Verify prompt manifest is pinned
        run: python scripts/generate_prompt_manifest.py --root . --check
      - name: Unit and integration tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Zero-network acceptance path
        env:
          PYTHONPATH: src
        run: python scripts/reportctl.py self-test --root .
