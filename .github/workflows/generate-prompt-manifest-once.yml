name: Generate Prompt Manifest Once

on:
  push:
    branches: ["feat/public-v0.1.0"]
    paths: [".github/workflows/generate-prompt-manifest-once.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Generate and commit manifest
        run: |
          python scripts/generate_prompt_manifest.py --root .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/prompt-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "build: pin public prompt digests"
          git push origin "HEAD:${GITHUB_REF_NAME}"
